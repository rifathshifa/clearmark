services:
  - type: web
    name: clearmark
    env: python
    region: ohio
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    healthCheckPath: "/api/status"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
